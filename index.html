<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Amala GSD</title>
    <script>
        // Google/Supabase sign-in can land on the site root: forward it (with its code or error) to the login page.
        // Anything else goes to the home page.
        (function () {
            var q = window.location.search || '';
            var h = window.location.hash || '';
            var isAuthReturn = /[?&#](code|error|error_code|error_description|access_token)=/.test(q + h);
            window.location.replace((isAuthReturn ? 'log_in.html' : 'main.html') + q + h);
        })();
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=main.html"></noscript>
</head>
<body></body>
</html>
